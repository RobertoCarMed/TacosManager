apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: 'com.google.gms.google-services'

// react-native-config: map cada variante de flavor a su archivo .env
project.ext.envConfigFiles = [
    developmentdebug: ".env.development",
    developmentrelease: ".env.development",
    qadebug: ".env.qa",
    qarelease: ".env.qa",
    productiondebug: ".env.production",
    productionrelease: ".env.production",
]

apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

// Keystore credentials: leídas del .env raíz (independiente del ambiente, no commiteado)
def keystoreProps = new Properties()
def keystoreEnvFile = rootProject.file("../.env")
if (keystoreEnvFile.exists()) {
    keystoreProps.load(new FileInputStream(keystoreEnvFile))
}

react {
    // Variantes debug no bundlean JS — Metro las sirve en tiempo real
    debuggableVariants = ["developmentDebug", "qaDebug", "productionDebug"]

    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tacosmanager"

    defaultConfig {
        applicationId "com.tacosmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.5.1"
    }

    flavorDimensions "environment"

    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        qa {
            dimension "environment"
            applicationIdSuffix ".qa"
            versionNameSuffix "-qa"
        }
        production {
            dimension "environment"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(keystoreProps['MYAPP_UPLOAD_STORE_FILE'] ?: "")
            storePassword keystoreProps['MYAPP_UPLOAD_STORE_PASSWORD'] ?: ""
            keyAlias keystoreProps['MYAPP_UPLOAD_KEY_ALIAS'] ?: ""
            keyPassword keystoreProps['MYAPP_UPLOAD_KEY_PASSWORD'] ?: ""
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
