name: Mobile CI

on:
  push:
    branches: [main, qa, dev]
  pull_request:
    branches: [main, qa, dev]

env:
  JAVA_VERSION: '17'

# ─── Estructura de jobs ────────────────────────────────────────────────────────
#
#   Mobile • Lint & TypeCheck   ← todos los triggers
#          ↓
#   Mobile • Build QA APK       ← solo push a qa y main
#          ↓
#   Mobile • Build Production AAB ← solo push a main
#
# Composite Action: no implementada. Con solo dos jobs de build que comparten
# el mismo setup de 4 pasos, el overhead de un archivo action.yml adicional
# supera el beneficio. El setup es idéntico y legible inline.

jobs:
  lint-typecheck:
    name: Mobile • Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || (echo "::error::Lint failed — fix all ESLint errors before merging" && exit 1)

      - name: TypeCheck
        run: npm run typecheck || (echo "::error::TypeCheck failed — fix all TypeScript errors before merging" && exit 1)

  build-qa:
    name: Mobile • Build QA APK
    runs-on: ubuntu-latest
    needs: lint-typecheck
    if: github.event_name == 'push' && (github.ref == 'refs/heads/qa' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Create .env.qa
        run: |
          printf 'API_URL=%s\nSOCKET_URL=%s\nENVIRONMENT=qa\n' \
            "${{ vars.QA_API_URL }}" "${{ vars.QA_SOCKET_URL }}" > .env.qa

      - name: Create signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'MYAPP_UPLOAD_STORE_FILE=tacosmanager.keystore\nMYAPP_UPLOAD_KEY_ALIAS=tacosmanager-key\nMYAPP_UPLOAD_STORE_PASSWORD=%s\nMYAPP_UPLOAD_KEY_PASSWORD=%s\n' \
            "${KEYSTORE_PASSWORD}" "${KEY_PASSWORD}" > .env

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>&1 | tail -3 || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build QA APK
        run: npm run build:android:qa || (echo "::error::QA APK build failed — review Gradle output above for details" && exit 1)

      - name: Upload APK QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-qa-release-${{ github.sha }}
          path: android/app/build/outputs/apk/qa/release/app-qa-release.apk
          retention-days: 30

  build-production:
    name: Mobile • Build Production AAB
    runs-on: ubuntu-latest
    needs: build-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Create .env.production
        run: |
          printf 'API_URL=%s\nSOCKET_URL=%s\nENVIRONMENT=production\n' \
            "${{ vars.PROD_API_URL }}" "${{ vars.PROD_SOCKET_URL }}" > .env.production

      - name: Create signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'MYAPP_UPLOAD_STORE_FILE=tacosmanager.keystore\nMYAPP_UPLOAD_KEY_ALIAS=tacosmanager-key\nMYAPP_UPLOAD_STORE_PASSWORD=%s\nMYAPP_UPLOAD_KEY_PASSWORD=%s\n' \
            "${KEYSTORE_PASSWORD}" "${KEY_PASSWORD}" > .env

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>&1 | tail -3 || true

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Production AAB
        run: npm run build:android:prod || (echo "::error::Production AAB build failed — review Gradle output above for details" && exit 1)

      - name: Upload AAB Production artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-production-release-${{ github.sha }}
          path: android/app/build/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 30
